<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="theme-color" content="#2E8B57">
<title>Hábitos</title>
<style>
  :root{
    --bg:#F6F7F3; --card:#FFFFFF; --text:#1B211D; --subtext:#6B756F;
    --accent:#2E8B57; --ring:#E7EAE5; --border:#E9ECE7; --danger:#C1553B;
  }
  [data-theme="dark"]{
    --bg:#14181A; --card:#1D2224; --text:#EDEFEE; --subtext:#9AA3A0;
    --accent:#5FBF8F; --ring:#2A3033; --border:#262C2E; --danger:#E0705A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#00000010;}
  body{
    font-family:-apple-system, "Segoe UI", system-ui, sans-serif;
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:480px; min-height:100vh; background:var(--bg); color:var(--text);
    position:relative; padding-bottom:96px; overflow-x:hidden;
  }
  button{font-family:inherit;}
  .page{padding:20px 18px 10px; animation:fadeUp .25s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pulse{0%{transform:scale(1);}45%{transform:scale(1.18);}100%{transform:scale(1);}}
  .pulse{animation:pulse .4s ease;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px;}
  .pill{padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600;}
  .btn-primary{background:var(--accent); color:#fff; border:none; border-radius:14px; padding:13px; font-size:14.5px; font-weight:700; cursor:pointer;}
  .btn-ghost{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:9px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text);}
  .input{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none;}
  .label{display:block; font-size:12px; font-weight:600; color:var(--subtext); margin-bottom:6px;}
  .navbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:var(--card); border-top:1px solid var(--border); display:flex; justify-content:space-around;
    padding:10px 6px calc(12px + env(safe-area-inset-bottom)); z-index:30;
  }
  .navbtn{display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; color:var(--subtext); padding:4px 10px; font-size:19px;}
  .navbtn.active{color:var(--accent);}
  .navbtn span{font-size:10.5px; font-weight:500;}
  .navbtn.active span{font-weight:700;}
  .fab{
    position:fixed; left:calc(50% + 480px/2 - 70px); bottom:96px; width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:26px; display:flex; align-items:center;
    justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.22); cursor:pointer; z-index:30;
  }
  @media (max-width:480px){ .fab{ left:auto; right:18px; } }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end;
    justify-content:center; z-index:100;
  }
  .modal-sheet{
    width:100%; max-width:480px; background:var(--card); border-radius:22px 22px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; animation:fadeUp .22s ease;
  }
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:200;
    box-shadow:0 6px 18px rgba(0,0,0,.2); white-space:nowrap;
  }
  .emoji-grid, .cat-grid, .freq-grid{display:flex; flex-wrap:wrap; gap:6px;}
  .emoji-opt{width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer; border:1px solid var(--border); background:var(--bg);}
  .emoji-opt.sel{border:2px solid var(--accent);}
  .cat-opt{padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text);}
  .day-opt{width:34px; height:34px; border-radius:50%; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text);}
  .day-opt.sel{border:none; background:var(--accent); color:#fff;}
  textarea{font-family:monospace;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== CONFIG ============================== */
const CATEGORIES = [
  { id:"salud", label:"Salud", color:"#3FA37A" },
  { id:"estudio", label:"Estudio", color:"#5B6FE0" },
  { id:"ejercicio", label:"Ejercicio", color:"#E08A3F" },
  { id:"bienestar", label:"Bienestar", color:"#9B6FD1" },
  { id:"productividad", label:"Productividad", color:"#3F9BD1" },
  { id:"personal", label:"Personal", color:"#D66E9C" },
  { id:"otros", label:"Otros", color:"#8A8F98" },
];
const EMOJIS = ["🏃","🧘","💧","📖","🛏️","🧠","🚶","🧹","😴","🍎","💊","✍️","🎨","🎧","🧴","🪥","🚿","🌱","💪","☕","📵","🧾","🐶","🎵"];
const DAY_PICKS = [{l:"L",v:1},{l:"M",v:2},{l:"X",v:3},{l:"J",v:4},{l:"V",v:5},{l:"S",v:6},{l:"D",v:0}];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const WD_LABELS = ["L","M","X","J","V","S","D"];
const WD_FULL = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const STORAGE_KEY = "habitos-app-data-v1";

/* ============================== DATE HELPERS ============================== */
function toDateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`;}
function todayStr(){return toDateStr(new Date());}
function parseDateStr(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(ds,n){const d=parseDateStr(ds);d.setDate(d.getDate()+n);return toDateStr(d);}
function weekdayOf(ds){return parseDateStr(ds).getDay();}

function isActive(h, ds){
  if (ds < h.createdAt) return false;
  if (h.frequency.type === "daily") return true;
  if (h.frequency.type === "specific") return h.frequency.days.includes(weekdayOf(ds));
  if (h.frequency.type === "once"){
    const doneDate = Object.keys(h.completions).find(d => h.completions[d]?.done);
    if (!doneDate) return true;
    return doneDate === ds;
  }
  return false;
}
function isDone(h, ds){
  const e = h.completions[ds];
  if (!e) return false;
  if (h.goal?.enabled) return e.progress >= h.goal.target;
  return !!e.done;
}
function dayStats(habits, ds){
  const active = habits.filter(h => isActive(h, ds));
  const done = active.filter(h => isDone(h, ds));
  const pct = active.length === 0 ? 0 : Math.round((done.length/active.length)*100);
  return { active, done, pct, pending: active.length - done.length };
}
function habitStreak(h){
  let streak=0, cursor=todayStr();
  if (isActive(h,cursor) && !isDone(h,cursor)) cursor = addDays(cursor,-1);
  let guard=0;
  while(guard++ < 3660){
    if (isActive(h,cursor)){
      if (isDone(h,cursor)){ streak++; cursor=addDays(cursor,-1); } else break;
    } else {
      cursor = addDays(cursor,-1);
      if (cursor < h.createdAt) break;
    }
  }
  return streak;
}
function generalStreak(habits){
  if (habits.length===0) return 0;
  let streak=0, cursor=todayStr();
  const t = dayStats(habits, cursor);
  if (t.active.length===0 || t.pct<100) cursor = addDays(cursor,-1);
  let guard=0;
  while(guard++ < 3660){
    const s = dayStats(habits, cursor);
    if (s.active.length===0){ cursor=addDays(cursor,-1); continue; }
    if (s.pct===100){ streak++; cursor=addDays(cursor,-1); } else break;
  }
  return streak;
}
function greeting(){
  const h = new Date().getHours();
  if (h<6) return "Buenas noches";
  if (h<12) return "Buenos días";
  if (h<20) return "Buenas tardes";
  return "Buenas noches";
}

/* ============================== STATE ============================== */
let state = {
  habits: [],
  theme: "light",
  view: "today",
  calY: new Date().getFullYear(),
  calM: new Date().getMonth(),
  calSelected: todayStr(),
  modal: null,       // {type:'habitForm', habit:{...}|null} | {type:'goal', id}
  toast: null,
  pulseId: null,
  celebratedDates: new Set(),
};

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      state.habits = parsed.habits || [];
      state.theme = parsed.theme || "light";
    }
  }catch(e){ console.warn("No se pudo leer localStorage", e); }
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ habits: state.habits, theme: state.theme }));
  }catch(e){ console.warn("No se pudo guardar en localStorage", e); }
}

/* ============================== MUTATIONS ============================== */
function genId(){ return "h" + Date.now() + Math.floor(Math.random()*1000); }

function toggleComplete(id, ds){
  ds = ds || todayStr();
  const h = state.habits.find(x=>x.id===id);
  if (!h) return;
  const cur = h.completions[ds] || { done:false, progress:0 };
  if (h.goal?.enabled){
    const reached = cur.progress >= h.goal.target;
    h.completions[ds] = { progress: reached ? 0 : h.goal.target, done: !reached };
  } else {
    h.completions[ds] = { ...cur, done: !cur.done };
  }
  state.pulseId = id;
  save(); render();
  setTimeout(()=>{ state.pulseId=null; render(); }, 420);
  checkCelebration();
}
function adjustGoal(id, delta, ds){
  ds = ds || todayStr();
  const h = state.habits.find(x=>x.id===id);
  if (!h) return;
  const cur = h.completions[ds] || { done:false, progress:0 };
  const next = Math.max(0, Math.min(h.goal.target, cur.progress + delta));
  h.completions[ds] = { progress: next, done: next >= h.goal.target };
  save(); render();
  if (next >= h.goal.target) checkCelebration();
}
function checkCelebration(){
  const ds = todayStr();
  const s = dayStats(state.habits, ds);
  if (s.active.length>0 && s.pct===100 && !state.celebratedDates.has(ds)){
    state.celebratedDates.add(ds);
    state.toast = "🎉 ¡Día completado! Todos tus hábitos hechos.";
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3200);
  }
}
function saveHabitForm(form){
  if (form.id){
    const h = state.habits.find(x=>x.id===form.id);
    Object.assign(h, form);
  } else {
    state.habits.push({
      id: genId(), name: form.name, emoji: form.emoji, category: form.category,
      frequency: form.frequency, time: form.time || null, goal: form.goal,
      reminder: false, createdAt: todayStr(), completions: {},
    });
  }
  state.modal = null;
  save(); render();
}
function deleteHabit(id){
  state.habits = state.habits.filter(h=>h.id!==id);
  state.modal = null;
  save(); render();
}
function toggleReminder(id){
  const h = state.habits.find(x=>x.id===id);
  if (h) h.reminder = !h.reminder;
  save(); render();
}
function resetAll(){
  state.habits = [];
  save(); render();
}
function setTheme(t){ state.theme = t; save(); render(); }
function setView(v){ state.view = v; render(); }

/* ============================== RENDER HELPERS ============================== */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function catOf(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1]; }

function ring(percent, size, stroke){
  size = size||92; stroke = stroke||9;
  const r=(size-stroke)/2, c=2*Math.PI*r, off = c - (Math.min(percent,100)/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--ring)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--accent)" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset .5s"/>
  </svg>`;
}
function pill(catId){
  const c = catOf(catId);
  return `<span class="pill" style="background:${c.color}22; color:${c.color}">${esc(c.label)}</span>`;
}
function emptyState(text){
  return `<div style="text-align:center; padding:48px 20px; color:var(--subtext); font-size:14px; line-height:1.5; border:1.5px dashed var(--border); border-radius:16px;">${esc(text)}</div>`;
}

/* ============================== VIEWS ============================== */
function renderToday(){
  const ds = todayStr();
  const stats = dayStats(state.habits, ds);
  const gs = generalStreak(state.habits);
  const d = parseDateStr(ds);
  const dateLabel = `${WD_FULL[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;

  let cards = "";
  if (stats.active.length===0){
    cards = emptyState("No tienes actividades para hoy. Toca el botón + para crear tu primer hábito.");
  } else {
    cards = `<div style="display:flex; flex-direction:column; gap:10px;">` + stats.active.map(h=>taskCard(h, ds)).join("") + `</div>`;
  }

  return `<div class="page">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px;">
      <div>
        <div style="font-size:21px; font-weight:700;">${greeting()}</div>
        <div style="font-size:13.5px; color:var(--subtext); margin-top:2px; text-transform:capitalize;">${dateLabel}</div>
        ${gs>0 ? `<div style="display:flex; align-items:center; gap:5px; margin-top:8px; font-size:13px; font-weight:600; color:#E08A3F;">🔥 ${gs} ${gs===1?"día":"días"} seguidos</div>` : ""}
      </div>
      <div style="position:relative; width:92px; height:92px; flex-shrink:0;">
        ${ring(stats.pct)}
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700;">${stats.pct}%</div>
      </div>
    </div>
    ${cards}
  </div>`;
}

function taskCard(h, ds){
  const entry = h.completions[ds] || { progress:0, done:false };
  const done = isDone(h, ds);
  const streak = habitStreak(h);
  const pulsing = state.pulseId === h.id;
  const btnInner = done ? `<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    : (h.goal?.enabled ? `<span style="font-size:15px;">💧</span>` : "");
  const onClickToggle = h.goal?.enabled ? `openGoalModal('${h.id}')` : `toggleComplete('${h.id}')`;
  return `<div class="card" onclick="openHabitEditor('${h.id}')" style="display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; opacity:${done?0.6:1};">
    <div style="font-size:26px; width:34px; text-align:center; flex-shrink:0;">${h.emoji}</div>
    <div style="flex:1; min-width:0;">
      <div style="font-size:15px; font-weight:600; text-decoration:${done?"line-through":"none"}; color:${done?"var(--subtext)":"var(--text)"}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(h.name)}</div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap;">
        ${pill(h.category)}
        ${h.time ? `<span style="font-size:11px; color:var(--subtext);">${esc(h.time)}</span>` : ""}
        ${streak>0 ? `<span style="font-size:11px; color:#E08A3F; font-weight:600;">🔥${streak}</span>` : ""}
        ${h.goal?.enabled ? `<span style="font-size:11px; color:var(--subtext);">${entry.progress}/${h.goal.target} ${esc(h.goal.unit)}</span>` : ""}
      </div>
    </div>
    <button onclick="event.stopPropagation(); ${onClickToggle}" class="${pulsing?'pulse':''}" style="width:38px; height:38px; border-radius:50%; flex-shrink:0; border:${done?"none":"2px solid var(--ring)"}; background:${done?"var(--accent)":"transparent"}; display:flex; align-items:center; justify-content:center; cursor:pointer;">${btnInner}</button>
  </div>`;
}

function renderCalendar(){
  const y=state.calY, m=state.calM;
  const first = new Date(y,m,1);
  const startWd = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayS = todayStr();

  let cells = "";
  for (let i=0;i<startWd;i++) cells += `<div></div>`;
  for (let dnum=1; dnum<=daysInMonth; dnum++){
    const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(dnum).padStart(2,"0")}`;
    const s = dayStats(state.habits, ds);
    const isSel = ds===state.calSelected, isToday = ds===todayS, hasData = s.active.length>0;
    const bg = isSel ? "var(--accent)" : hasData ? `color-mix(in srgb, var(--accent) ${Math.max(s.pct,8)}%, var(--card))` : "var(--card)";
    const color = isSel ? "#fff" : "var(--text)";
    cells += `<button onclick="selectCalDay('${ds}')" style="aspect-ratio:1; border-radius:10px; border:${isToday?"1.5px solid var(--accent)":"1px solid transparent"}; background:${bg}; color:${color}; font-size:13px; font-weight:500; cursor:pointer;">${dnum}</button>`;
  }

  const selStats = dayStats(state.habits, state.calSelected);
  const sd = parseDateStr(state.calSelected);
  const selLabel = `${WD_FULL[sd.getDay()]}, ${sd.getDate()} de ${MONTHS[sd.getMonth()]}`;

  let detailList = selStats.active.length===0
    ? `<div style="font-size:13px; color:var(--subtext);">Sin actividades registradas este día.</div>`
    : `<div style="display:flex; flex-direction:column; gap:8px;">` + selStats.active.map(h=>{
        const done = isDone(h, state.calSelected);
        return `<div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:16px;">${h.emoji}</span>
          <span style="font-size:13px; flex:1; text-decoration:${done?"line-through":"none"}; color:${done?"var(--subtext)":"var(--text)"};">${esc(h.name)}</span>
          <span style="font-size:11px; font-weight:600; color:${done?"var(--accent)":"var(--subtext)"};">${done?"Hecho":"Pendiente"}</span>
        </div>`;
      }).join("") + `</div>`;

  return `<div class="page">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
      <button class="btn-ghost" onclick="changeMonth(-1)" style="width:34px; height:34px; padding:0; border-radius:10px;">‹</button>
      <div style="font-size:16px; font-weight:700; text-transform:capitalize;">${MONTHS[m]} ${y}</div>
      <button class="btn-ghost" onclick="changeMonth(1)" style="width:34px; height:34px; padding:0; border-radius:10px;">›</button>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px;">
      ${WD_LABELS.map(l=>`<div style="text-align:center; font-size:11px; color:var(--subtext); font-weight:600; padding:4px 0;">${l}</div>`).join("")}
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">${cells}</div>
    <div class="card" style="margin-top:20px; padding:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:13.5px; font-weight:700; text-transform:capitalize;">${selLabel}</div>
        <div style="font-size:12.5px; font-weight:700; color:var(--accent);">${selStats.pct}%</div>
      </div>
      ${detailList}
    </div>
  </div>`;
}

function renderProgress(){
  const ds = todayStr();
  const stats = dayStats(state.habits, ds);
  const gs = generalStreak(state.habits);
  const last7 = [];
  for (let i=6;i>=0;i--){ const d=addDays(ds,-i); last7.push({date:d, ...dayStats(state.habits,d)}); }
  const weekCount = last7.reduce((s,d)=>s+d.done.length,0);

  const bars = last7.map(d=>{
    const dow = parseDateStr(d.date).getDay();
    const label = ["D","L","M","X","J","V","S"][dow];
    const isToday = d.date===ds;
    const h = d.active.length ? d.pct : 0;
    return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="width:100%; height:64px; background:var(--ring); border-radius:6px; display:flex; align-items:flex-end; overflow:hidden;">
        <div style="width:100%; height:${h}%; background:var(--accent); border-radius:6px; transition:height .4s;"></div>
      </div>
      <span style="font-size:10.5px; color:${isToday?"var(--accent)":"var(--subtext)"}; font-weight:${isToday?700:500};">${label}</span>
    </div>`;
  }).join("");

  const streakList = state.habits.length===0
    ? emptyState("Crea hábitos para empezar a ver tus rachas y estadísticas.")
    : `<div style="display:flex; flex-direction:column; gap:8px;">` + state.habits.map(h=>{
        const s = habitStreak(h);
        return `<div class="card" style="display:flex; align-items:center; gap:10px; padding:10px 12px;">
          <span style="font-size:20px;">${h.emoji}</span>
          <span style="flex:1; font-size:13.5px; font-weight:500;">${esc(h.name)}</span>
          <span style="font-size:12.5px; font-weight:700; color:${s>0?"#E08A3F":"var(--subtext)"};">${s>0?"🔥 ":""}${s} ${s===1?"día":"días"}</span>
        </div>`;
      }).join("") + `</div>`;

  function statBox(label,value){
    return `<div class="card" style="padding:14px;"><div style="font-size:20px; font-weight:700;">${value}</div><div style="font-size:11.5px; color:var(--subtext); margin-top:2px;">${esc(label)}</div></div>`;
  }

  return `<div class="page">
    <div style="font-size:19px; font-weight:700; margin-bottom:16px;">Progreso</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
      ${statBox("Completadas hoy", stats.done.length)}
      ${statBox("Pendientes hoy", stats.pending)}
      ${statBox("Cumplimiento hoy", stats.pct+"%")}
      ${statBox("Racha general", "🔥 "+gs)}
    </div>
    <div class="card" style="padding:16px; margin-bottom:16px;">
      <div style="font-size:13.5px; font-weight:700; margin-bottom:4px;">Últimos 7 días</div>
      <div style="font-size:12px; color:var(--subtext); margin-bottom:12px;">${weekCount} hábitos completados esta semana</div>
      <div style="display:flex; align-items:flex-end; gap:8px; height:90px;">${bars}</div>
    </div>
    <div style="font-size:13.5px; font-weight:700; margin-bottom:8px;">Rachas por hábito</div>
    ${streakList}
  </div>`;
}

function renderSettings(){
  const remindersList = state.habits.length===0
    ? `<div style="font-size:13px; color:var(--subtext); margin-bottom:16px;">Todavía no tienes hábitos creados.</div>`
    : `<div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">` + state.habits.map(h=>`
        <div class="card" style="display:flex; align-items:center; gap:10px; padding:10px 12px;">
          <span style="font-size:18px;">${h.emoji}</span>
          <span style="flex:1; font-size:13.5px;">${esc(h.name)}${h.time?` · ${esc(h.time)}`:""}</span>
          <span style="font-size:14px;">${h.reminder?"🔔":"🔕"}</span>
          ${toggleSwitch(h.reminder, `toggleReminder('${h.id}')`)}
        </div>`).join("") + `
        <div style="font-size:11.5px; color:var(--subtext); line-height:1.5; margin-top:2px;">Los recordatorios son visuales; no envían notificaciones del sistema.</div>
      </div>`;

  return `<div class="page">
    <div style="font-size:19px; font-weight:700; margin-bottom:16px;">Ajustes</div>
    <div style="font-size:11.5px; color:var(--accent); font-weight:600; margin-bottom:16px;">✓ Guardado local activo — tus datos persisten en este navegador.</div>

    <div class="card" style="padding:14px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:16px;">${state.theme==="dark"?"🌙":"☀️"}</span>
        <span style="font-size:14px; font-weight:500;">Modo oscuro</span>
      </div>
      ${toggleSwitch(state.theme==="dark", `setTheme('${state.theme==="dark"?"light":"dark"}')`)}
    </div>

    <div style="font-size:13.5px; font-weight:700; margin-bottom:8px;">Recordatorios por hábito</div>
    ${remindersList}

    <div id="resetZone" style="margin-top:8px;">
      <button class="btn-ghost" onclick="askReset()" style="color:var(--danger); border-color:#C1553B44;">🗑️ Borrar todos los datos</button>
    </div>
  </div>`;
}

function toggleSwitch(checked, onclick){
  return `<button onclick="${onclick}" style="width:42px; height:24px; border-radius:999px; border:none; cursor:pointer; background:${checked?"var(--accent)":"var(--ring)"}; position:relative; flex-shrink:0;">
    <div style="width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:3px; left:${checked?21:3}px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.25);"></div>
  </button>`;
}

function askReset(){
  document.getElementById("resetZone").innerHTML = `
    <div style="display:flex; gap:8px;">
      <button onclick="resetAll()" style="flex:1; background:var(--danger); color:#fff; border:none; border-radius:12px; padding:10px 14px; font-size:13.5px; font-weight:600; cursor:pointer;">Sí, borrar</button>
      <button onclick="render()" class="btn-ghost" style="flex:1;">Cancelar</button>
    </div>`;
}
function changeMonth(delta){
  let nm = state.calM + delta, ny = state.calY;
  if (nm<0){ nm=11; ny--; } if (nm>11){ nm=0; ny++; }
  state.calM=nm; state.calY=ny; render();
}
function selectCalDay(ds){ state.calSelected = ds; render(); }

/* ============================== MODALS ============================== */
function openHabitEditor(id){
  const h = state.habits.find(x=>x.id===id);
  state.modal = { type:"habitForm", habit: h ? JSON.parse(JSON.stringify(h)) : null, form: h ? {
    name:h.name, emoji:h.emoji, category:h.category,
    freqType:h.frequency.type, freqDays:h.frequency.type==="specific"?[...h.frequency.days]:[1,2,3,4,5],
    time:h.time||"", goalEnabled:!!h.goal?.enabled, goalTarget:h.goal?.target||2, goalUnit:h.goal?.unit||"L", id:h.id,
  } : { name:"", emoji:EMOJIS[0], category:"salud", freqType:"daily", freqDays:[1,2,3,4,5], time:"", goalEnabled:false, goalTarget:2, goalUnit:"L", id:null } };
  render();
}
function closeModal(){ state.modal=null; render(); }
function openGoalModal(id){ state.modal = { type:"goal", id }; render(); }

function updForm(patch){
  Object.assign(state.modal.form, patch);
  render();
}
function toggleFreqDay(v){
  const f = state.modal.form;
  f.freqDays = f.freqDays.includes(v) ? f.freqDays.filter(x=>x!==v) : [...f.freqDays, v].sort();
  render();
}
function submitHabitForm(){
  const f = state.modal.form;
  const name = document.getElementById("habitNameInput").value.trim();
  const time = document.getElementById("habitTimeInput").value;
  const goalTarget = document.getElementById("goalTargetInput") ? document.getElementById("goalTargetInput").value : f.goalTarget;
  const goalUnit = document.getElementById("goalUnitInput") ? document.getElementById("goalUnitInput").value : f.goalUnit;
  if (!name) return;
  saveHabitForm({
    id: f.id,
    name, emoji: f.emoji, category: f.category,
    frequency: f.freqType==="specific" ? { type:"specific", days: f.freqDays.length?f.freqDays:[1,2,3,4,5] } : { type:f.freqType },
    time: time || null,
    goal: f.goalEnabled ? { enabled:true, target:Number(goalTarget)||1, unit:goalUnit||"und." } : { enabled:false },
  });
}

function renderModal(){
  if (!state.modal) return "";
  if (state.modal.type === "goal") return renderGoalModal();
  return renderHabitFormModal();
}

function renderHabitFormModal(){
  const f = state.modal.form;
  const isEdit = !!f.id;
  const emojiGrid = EMOJIS.map(e=>`<button class="emoji-opt ${f.emoji===e?'sel':''}" onclick="updForm({emoji:'${e}'})">${e}</button>`).join("");
  const catGrid = CATEGORIES.map(c=>`<button class="cat-opt" style="${f.category===c.id?`border:2px solid ${c.color}; background:${c.color}22; color:${c.color};`:""}" onclick="updForm({category:'${c.id}'})">${esc(c.label)}</button>`).join("");
  const freqBtns = [["daily","Todos los días"],["specific","Días específicos"],["once","Una vez"]].map(([v,l])=>
    `<button style="flex:1; padding:8px 6px; border-radius:10px; font-size:11.5px; font-weight:600; cursor:pointer; ${f.freqType===v?"border:2px solid var(--accent); background:var(--accent)22; color:var(--accent);":"border:1px solid var(--border); background:var(--bg); color:var(--text);"}" onclick="updForm({freqType:'${v}'})">${l}</button>`
  ).join("");
  const dayPicks = f.freqType==="specific" ? `<div style="display:flex; gap:5px; margin-top:8px;">` + DAY_PICKS.map(d=>
    `<button class="day-opt ${f.freqDays.includes(d.v)?'sel':''}" onclick="toggleFreqDay(${d.v})">${d.l}</button>`
  ).join("") + `</div>` : "";
  const goalFields = f.goalEnabled ? `<div style="display:flex; gap:8px; margin-top:10px;">
      <input id="goalTargetInput" class="input" type="number" min="1" value="${f.goalTarget}" style="width:80px;">
      <input id="goalUnitInput" class="input" value="${esc(f.goalUnit)}" placeholder="L, vasos, pág.">
    </div>` : "";

  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <div style="font-size:15.5px; font-weight:700;">${isEdit?"Editar hábito":"Nuevo hábito"}</div>
        <button onclick="closeModal()" style="background:none; border:none; cursor:pointer; color:var(--subtext); font-size:20px;">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div><label class="label">Nombre</label><input id="habitNameInput" class="input" value="${esc(f.name)}" placeholder="Ej. Meditar"></div>
        <div><label class="label">Icono</label><div class="emoji-grid">${emojiGrid}</div></div>
        <div><label class="label">Categoría</label><div class="cat-grid">${catGrid}</div></div>
        <div>
          <label class="label">Frecuencia</label>
          <div style="display:flex; gap:6px;">${freqBtns}</div>
          ${dayPicks}
        </div>
        <div><label class="label">Hora (opcional)</label><input id="habitTimeInput" type="time" class="input" value="${esc(f.time)}"></div>
        <div style="background:var(--bg); border-radius:12px; padding:12px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <label class="label" style="margin-bottom:0;">Objetivo cuantificable</label>
            ${toggleSwitch(f.goalEnabled, `updForm({goalEnabled:${!f.goalEnabled}})`)}
          </div>
          ${goalFields}
        </div>
        <button class="btn-primary" onclick="submitHabitForm()">${isEdit?"Guardar cambios":"Crear hábito"}</button>
        ${isEdit ? `<button class="btn-ghost" style="color:var(--danger); border-color:#C1553B44;" onclick="deleteHabit('${f.id}')">🗑️ Eliminar hábito</button>` : ""}
      </div>
    </div>
  </div>`;
}

function renderGoalModal(){
  const h = state.habits.find(x=>x.id===state.modal.id);
  if (!h) { state.modal=null; return ""; }
  const ds = todayStr();
  const entry = h.completions[ds] || { progress:0 };
  const pct = Math.min(100, Math.round((entry.progress/h.goal.target)*100));
  return `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <div style="font-size:15.5px; font-weight:700;">${esc(h.name)}</div>
        <button onclick="closeModal()" style="background:none; border:none; cursor:pointer; color:var(--subtext); font-size:20px;">✕</button>
      </div>
      <div style="text-align:center; padding:8px 0 4px;">
        <div style="font-size:38px;">${h.emoji}</div>
        <div style="margin:14px auto 6px; position:relative; width:130px; height:130px;">
          ${ring(pct,130,11)}
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div style="font-size:22px; font-weight:700;">${entry.progress}/${h.goal.target}</div>
            <div style="font-size:12px; color:var(--subtext);">${esc(h.goal.unit)}</div>
          </div>
        </div>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:18px;">
          <button class="btn-ghost" style="width:64px; height:44px; font-size:16px; font-weight:700;" onclick="adjustGoal('${h.id}', -1)">−1</button>
          <button class="btn-ghost" style="width:64px; height:44px; font-size:16px; font-weight:700; background:var(--accent); color:#fff; border-color:var(--accent);" onclick="adjustGoal('${h.id}', 1)">+1</button>
        </div>
        ${pct>=100 ? `<div style="margin-top:14px; color:var(--accent); font-weight:600; font-size:13.5px;">🎉 ¡Objetivo cumplido!</div>` : ""}
      </div>
    </div>
  </div>`;
}

/* ============================== ROOT RENDER ============================== */
function render(){
  document.body.setAttribute("data-theme", state.theme);
  document.documentElement.setAttribute("data-theme", state.theme);
  const view = state.view === "today" ? renderToday()
    : state.view === "calendar" ? renderCalendar()
    : state.view === "progress" ? renderProgress()
    : renderSettings();

  const nav = `<div class="navbar">
    ${navBtn("today","🏠","Hoy")}
    ${navBtn("calendar","📅","Calendario")}
    ${navBtn("progress","📊","Progreso")}
    ${navBtn("settings","⚙️","Ajustes")}
  </div>`;
  const fab = state.view==="today" ? `<button class="fab" onclick="openHabitEditor(null)">+</button>` : "";
  const toast = state.toast ? `<div class="toast">${esc(state.toast)}</div>` : "";

  document.getElementById("app").innerHTML = view + nav + fab + toast + renderModal();
}
function navBtn(v, icon, label){
  const active = state.view===v;
  return `<button class="navbtn ${active?'active':''}" onclick="setView('${v}')">${icon}<span>${label}</span></button>`;
}

/* ============================== INIT ============================== */
load();
render();
</script>
</body>
</html>
