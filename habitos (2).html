<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="theme-color" content="#2E8B57">
<title>Hábitos</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<style>
  :root{
    --bg:#F6F7F3; --card:#FFFFFF; --text:#1B211D; --subtext:#6B756F;
    --accent:#2E8B57; --ring:#E7EAE5; --border:#E9ECE7; --danger:#C1553B;
  }
  [data-theme="dark"]{
    --bg:#14181A; --card:#1D2224; --text:#EDEFEE; --subtext:#9AA3A0;
    --accent:#5FBF8F; --ring:#2A3033; --border:#262C2E; --danger:#E0705A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#0B0D0E; overflow-x:hidden; width:100%;}
  body{ font-family:-apple-system, "Segoe UI", system-ui, sans-serif; display:flex; justify-content:center; }
  #app{
    width:100%; max-width:480px; min-height:100vh; background:var(--bg); color:var(--text);
    position:relative; padding-bottom:100px; padding-top:env(safe-area-inset-top); overflow-x:hidden;
  }
  button{font-family:inherit;}
  .page{padding:14px 18px 10px; animation:fadeUp .22s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pulse{0%{transform:scale(1);}45%{transform:scale(1.18);}100%{transform:scale(1);}}
  @keyframes splashPulse{0%{transform:scale(1);}50%{transform:scale(1.12);}100%{transform:scale(1);}}
  .pulse{animation:pulse .4s ease;}
  .card{background:var(--card); border:1px solid var(--border); border-bottom:3.5px solid color-mix(in srgb, var(--subtext) 35%, var(--card)); border-radius:16px; transition:background .3s, border-color .3s;}
  .task-wrap{ position:relative; border-radius:16px; overflow:hidden; }
  .task-actions{ position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding-right:10px; }
  .swipe-action{ width:56px; height:56px; border-radius:16px; border:none; color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .task-front{ position:relative; transform:translateX(0px); transition:transform .18s ease; will-change:transform; }
  .habit-badge{ display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  @keyframes flashGreen{ 0%{ background:color-mix(in srgb, #3FA37A 55%, var(--card)); } 100%{ background:color-mix(in srgb, #3FA37A 16%, var(--card)); } }
  .flash-green{ animation:flashGreen .6s ease; }
  .pill{padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600;}
  .btn-primary{background:var(--accent); color:#fff; border:none; border-radius:14px; padding:13px; font-size:14.5px; font-weight:700; cursor:pointer;}
  .btn-ghost{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:9px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text);}
  .input{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none;}
  .label{display:block; font-size:12px; font-weight:600; color:var(--subtext); margin-bottom:6px;}

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .gearbtn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; flex-shrink:0; }

  .datestrip{ display:flex; gap:8px; overflow-x:auto; padding:10px 2px 14px; margin:0 -18px; padding-left:18px; padding-right:18px; scroll-behavior:auto; }
  .datestrip::-webkit-scrollbar{ display:none; }
  .datepillwrap{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; position:relative; }
  .datepillwrap::after{ content:""; position:absolute; left:50%; top:32px; width:44px; height:2px; background:#3FA37A; z-index:1; }
  .datepillwrap:last-child::after{ display:none; }
  .datepillwrap.no-line::after{ display:none; }
  .datepillwrap .wd{ font-size:9.5px; font-weight:600; color:var(--subtext); text-transform:uppercase; }
  .datepill{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; border:1.5px solid var(--border); position:relative; z-index:2; }

  .navbar-wrap{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    height:88px; z-index:30;
  }
  .navwave{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .navrow{
    position:relative; z-index:2; display:flex; align-items:flex-end; justify-content:space-around;
    height:100%; padding:28px 10px calc(10px + env(safe-area-inset-bottom));
  }
  .navspacer{ flex:0 0 auto; transition:width .25s ease; overflow:hidden; }
  @keyframes navFadeOut{ from{ opacity:1; transform:translate(-50%,-50%) scale(1); } to{ opacity:0; transform:translate(-50%,-50%) scale(0.3); } }
  @keyframes navFadeIn{ from{ opacity:0; transform:translate(-50%,-50%) scale(0.3); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
  .navcenter.nav-out{ animation:navFadeOut .22s ease forwards; }
  .navcenter.nav-in{ animation:navFadeIn .22s ease forwards; }
  .navbtn{display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; color:#8B9490; padding:4px 6px; font-size:22px;}
  .navbtn.active{color:#3B82F6;}
  .navbtn span{font-size:10px; font-weight:500; color:#8B9490;}
  .navbtn.active span{font-weight:700; color:#3B82F6;}
  .navcenter{
    position:absolute; left:50%; top:16px; transform:translate(-50%,-50%);
    width:54px; height:54px; border-radius:50%; background:#3B82F6; color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.4); z-index:3;
  }
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:100; }
  .fullscreen-modal{
    position:fixed; inset:0; z-index:150; display:flex; align-items:center; justify-content:center;
    padding:24px; animation:fadeUp .18s ease;
  }
  .fs-content{ text-align:center; width:100%; max-width:360px; }
  .fs-name{ font-size:17px; font-weight:700; color:#fff; }
  .fs-close{
    position:absolute; top:calc(18px + env(safe-area-inset-top)); right:18px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.28); border:none; color:#fff; font-size:18px; cursor:pointer;
  }
  .fs-btn{
    background:rgba(255,255,255,0.25); border:none; color:#fff; border-radius:16px; padding:14px 22px;
    font-size:15px; font-weight:700; cursor:pointer; min-width:88px;
  }
  .fs-btn-solid{ background:#fff; }
  .modal-sheet{
    width:100%; max-width:480px; background:var(--card); border-radius:22px 22px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; animation:fadeUp .22s ease;
  }
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:200;
    box-shadow:0 6px 18px rgba(0,0,0,.2); white-space:nowrap;
  }

  .emoji-opt{width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer; border:1px solid var(--border); background:var(--bg);}
  .emoji-opt.sel{border:2px solid var(--accent);}

  .day-opt{width:34px; height:34px; border-radius:50%; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text);}
  .day-opt.sel{border:none; background:var(--accent); color:#fff;}
  .choose-opt{ display:flex; align-items:center; gap:12px; padding:16px; border-radius:16px; border:1px solid var(--border); background:var(--bg); cursor:pointer; font-size:15px; font-weight:600; color:var(--text); width:100%; }
  textarea{font-family:monospace;}
</style>
</head>

<script>
/* ============================== CONFIG ============================== */
const CATEGORIES = [

const EMOJIS = ["🏃","🧘","💧","📖","🛏️","🧠","🚶","🧹","😴","🍎","💊","✍️","🎨","🎧","🧴","🪥","🚿","🌱","🤸","☕","📵","🧾","🐶","🎵","🎹","⚽","🏆","📚"];
const DAY_PICKS = [{l:"L",v:1},{l:"M",v:2},{l:"X",v:3},{l:"J",v:4},{l:"V",v:5},{l:"S",v:6},{l:"D",v:0}];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const NAV_BLUE = "#3B82F6";

function hexToRgb(hex){
  hex = hex.replace("#","");
  if (hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const n = parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
const iconCache = {};
function mixRgb(a,b,t){ return { r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t }; }
function getColoredIcon(char, colorHex, size){
  size = size || 64;
  const key = char+"|"+colorHex+"|"+size;
  if (iconCache[key]) return iconCache[key];
  try{
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.font = Math.floor(size*0.82) + `px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(char, size/2, size/2 + size*0.04);
    const img = ctx.getImageData(0,0,size,size);
    const rgb = hexToRgb(colorHex);
    const black = {r:0,g:0,b:0}, white = {r:255,g:255,b:255};
    const dark = mixRgb(rgb, black, 0.14);
    const light = mixRgb(rgb, white, 0.20);
    const d = img.data;
    for (let i=0;i<d.length;i+=4){
      if (d[i+3] > 8){
        // preserve the emoji's original shading as tone variation, tinted toward the chosen color
        const lum = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) / 255;
        d[i]   = dark.r + (light.r-dark.r)*lum;
        d[i+1] = dark.g + (light.g-dark.g)*lum;
        d[i+2] = dark.b + (light.b-dark.b)*lum;
      }
    }
    ctx.putImageData(img,0,0);
    const url = canvas.toDataURL();
    iconCache[key] = url;
    return url;
  }catch(e){ return null; }
}
const CUSTOM_ICONS = {
  "🤸": (c)=>`<circle cx="15.5" cy="6" r="2.6" fill="${c}"/>
    <path d="M13.5 8.2 C10 9.5 8.5 12 8.5 15" stroke="${c}" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <path d="M8.5 15 C8.5 15 11 16.8 14 16.8 C17 16.8 19 15 19 15" stroke="${c}" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13.5 9 L18 12" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M14 16.8 L14 20.5" stroke="${c}" stroke-width="4.2" fill="none" stroke-linecap="round"/>`,
};
function customIconSVG(char, colorHex, size){
  const fn = CUSTOM_ICONS[char];
  if (!fn) return null;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${fn(colorHex)}</svg>`;
}
function iconImg(char, colorHex, sizePx){
  const custom = customIconSVG(char, colorHex, sizePx);
  if (custom) return custom;
  const url = getColoredIcon(char, colorHex, 96);
  if (!url) return `<span style="font-size:${sizePx}px;">${char}</span>`;
  return `<img src="${url}" style="width:${sizePx}px; height:${sizePx}px; display:block;" draggable="false">`;
}
function stickerBadge(emoji, color, boxSize, iconSize, underline){
  const inner = iconImg(emoji, color, iconSize);
  const under = underline ? `<div class="habit-badge-underline" style="width:${boxSize}px; background:${color};"></div>` : "";
  return `<div class="habit-badge">
    <div class="habit-badge-box" style="width:${boxSize}px; height:${boxSize}px;">${inner}</div>
    ${under}
  </div>`;
}
const THEME_COLORS = {
  light: { accent:"#2E8B57", subtext:"#6B756F" },
  dark: { accent:"#5FBF8F", subtext:"#9AA3A0" },
};
/* Chubby filled stickman-style SVG poses for person emojis, colored via currentColor */
const STICK_FIGURES = {
  "🏃": (c)=>`<circle cx="15" cy="5" r="2.6" fill="${c}"/><path d="M14 8 L11 15" stroke="${c}" stroke-width="4.4" fill="none" stroke-linecap="round"/><path d="M14 9 L18 7" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M12 10 L7 12" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M11 15 L15 19" stroke="${c}" stroke-width="4.4" fill="none" stroke-linecap="round"/><path d="M11 15 L6 20" stroke="${c}" stroke-width="4.4" fill="none" stroke-linecap="round"/>`,
  "🚶": (c)=>`<circle cx="12" cy="5" r="2.6" fill="${c}"/><path d="M12 7.5 L12 14" stroke="${c}" stroke-width="4.6" fill="none" stroke-linecap="round"/><path d="M12 9 L16 11" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M12 9 L8 11.5" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M12 14 L15 20" stroke="${c}" stroke-width="4.4" fill="none" stroke-linecap="round"/><path d="M12 14 L9 20" stroke="${c}" stroke-width="4.4" fill="none" stroke-linecap="round"/>`,
  "🧘": (c)=>`<circle cx="12" cy="5.5" r="2.6" fill="${c}"/><path d="M12 8 L12 13" stroke="${c}" stroke-width="4.6" fill="none" stroke-linecap="round"/><path d="M12 9.5 L7 13" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M12 9.5 L17 13" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M5 16 C 9 13.5, 15 13.5, 19 16" stroke="${c}" stroke-width="4.4" fill="none" stroke-linecap="round"/>`,

  "😴": (c)=>`<circle cx="6" cy="14.5" r="2.6" fill="${c}"/><path d="M8.3 14.5 L18 14.5" stroke="${c}" stroke-width="4.4" fill="none" stroke-linecap="round"/><path d="M18 14.5 L21 12" stroke="${c}" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="M18 14.5 L21 17" stroke="${c}" stroke-width="3.6" fill="none" stroke-linecap="round"/><circle cx="15" cy="5.5" r="1" fill="${c}"/><circle cx="17.5" cy="4" r="1.3" fill="${c}"/><circle cx="20.3" cy="6" r="1.6" fill="${c}"/>`,
  "🛏️": (c)=>`<circle cx="6" cy="12.5" r="2.3" fill="${c}"/><path d="M8.3 12.5 L17 12.5" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M17 12.5 L19.5 10.5" stroke="${c}" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M17 12.5 L19.5 15.5" stroke="${c}" stroke-width="3.4" fill="none" stroke-linecap="round"/><rect x="3" y="16.5" width="18" height="4" rx="2" fill="${c}"/>`,
};
function stickFigureSVG(char, colorHex, size){
  const fn = STICK_FIGURES[char];
  if (!fn) return null;

}
function statsIconSVG(colorHex, size){

    <rect x="16" y="4" width="4" height="16" rx="1.4" fill="${colorHex}"/>
  </svg>`;
}

/* ============================== DATE HELPERS ============================== */
function toDateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`;}
function todayStr(){return toDateStr(new Date());}
function parseDateStr(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(ds,n){const d=parseDateStr(ds);d.setDate(d.getDate()+n);return toDateStr(d);}
function weekdayOf(ds){return parseDateStr(ds).getDay();}
function daysBetween(a,b){ return Math.round((parseDateStr(b)-parseDateStr(a))/86400000); }
function humanizeDuration(days){
  if (days <= 0) return "Hoy";
  if (days === 1) return "1 día";
  if (days < 14) return `${days} días`;
  if (days < 60) return `${Math.round(days/7)} semanas`;
  return `${Math.round(days/30)} meses`;
}

function isActive(h, ds){
  if (ds < h.createdAt) return false;
  if (h.frequency.type === "daily") return true;
  if (h.frequency.type === "specific") return h.frequency.days.includes(weekdayOf(ds));
  if (h.frequency.type === "once"){
    const doneDate = Object.keys(h.completions).find(d => h.completions[d]?.done);
    if (!doneDate) return true;
    return doneDate === ds;
  }
  return false;
}
function isDone(h, ds){
  const e = h.completions[ds];
  if (!e) return false;
  if (h.goal?.enabled) return e.progress >= h.goal.target;
  return !!e.done;
}
function dayStats(habits, ds){
  const active = habits.filter(h => isActive(h, ds));
  const done = active.filter(h => isDone(h, ds));
  const pct = active.length === 0 ? 0 : Math.round((done.length/active.length)*100);
  return { active, done, pct, pending: active.length - done.length };
}
function habitStreak(h){
  let streak=0, cursor=todayStr();
  if (isActive(h,cursor) && !isDone(h,cursor)) cursor = addDays(cursor,-1);
  let guard=0;
  while(guard++ < 3660){
    if (isActive(h,cursor)){
      if (isDone(h,cursor)){ streak++; cursor=addDays(cursor,-1); } else break;
    } else {
      cursor = addDays(cursor,-1);
      if (cursor < h.createdAt) break;
    }
  }
  return streak;
}
function generalStreak(habits){
  if (habits.length===0) return 0;
  let streak=0, cursor=todayStr();
  const t = dayStats(habits, cursor);
  if (t.active.length===0 || t.pct<100) cursor = addDays(cursor,-1);
  let guard=0;
  while(guard++ < 3660){
    const s = dayStats(habits, cursor);
    if (s.active.length===0){ cursor=addDays(cursor,-1); continue; }
    if (s.pct===100){ streak++; cursor=addDays(cursor,-1); } else break;
  }
  return streak;
}

  { id:"us-e", label:"EE.UU. (Este)", offset:-5 },
  { id:"us-w", label:"EE.UU. (Oeste)", offset:-8 },
  { id:"br", label:"Brasil", offset:-3 },
  { id:"es", label:"España", offset:1 },
  { id:"uk", label:"Reino Unido", offset:0 },
];
function getEffectiveHour(){
  if (state.utcOffset === null || state.utcOffset === undefined) return new Date().getHours();
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset()*60000;
  const local = new Date(utcMs + state.utcOffset*3600000);
  return local.getHours();
}
function greeting(){
  const h = getEffectiveHour();
  if (h<6) return "Buenas noches";
  if (h<12) return "Buenos días";
  if (h<20) return "Buenas tardes";
  return "Buenas noches";
}
function statusColor(pct, hasData){
  if (!hasData) return "var(--border)";
  if (pct===100) return "#3FA37A";
  if (pct===0) return "#C1553B";
  return "#E8B54A";
}

/* ============================== STATE ============================== */
let state = {
  habits: [],
  retos: [],
  habitOrder: [],
  theme: "dark",
  utcOffset: null,
  onboarded: false,
  profile: { productivity:null, bestTime:null },
  view: "principal", // principal | progress | retos | plan
  selectedDate: todayStr(),
  modal: null,
  toast: null,
  pulseId: null,
  celebratedDates: new Set(),
};

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      state.habits = parsed.habits || [];
      state.retos = parsed.retos || [];
      state.habitOrder = parsed.habitOrder || state.habits.map(h=>h.id);
      state.utcOffset = (parsed.utcOffset===undefined) ? null : parsed.utcOffset;
      state.onboarded = !!parsed.onboarded;
      state.profile = parsed.profile || { productivity:null, bestTime:null };
      state.theme = "dark";
    }
  }catch(e){ console.warn("No se pudo leer localStorage", e); }
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ habits: state.habits, retos: state.retos, habitOrder: state.habitOrder, theme: state.theme, utcOffset: state.utcOffset, onboarded: state.onboarded, profile: state.profile }));
  }catch(e){ console.warn("No se pudo guardar en localStorage", e); }
}
function orderedActive(activeList){
  return [...activeList].sort((a,b)=>{
    let ia = state.habitOrder.indexOf(a.id); if (ia===-1) ia = 9999;
    let ib = state.habitOrder.indexOf(b.id); if (ib===-1) ib = 9999;
    return ia - ib;
  });
}
function moveHabitOrder(id, dir){
  ensureOrderHasAll();
  const arr = state.habitOrder;
  const i = arr.indexOf(id);
  const j = i + dir;
  if (i<0 || j<0 || j>=arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  save(); render();
}
function ensureOrderHasAll(){
  const ids = state.habits.map(h=>h.id);
  state.habitOrder = state.habitOrder.filter(id=>ids.includes(id));
  ids.forEach(id=>{ if (!state.habitOrder.includes(id)) state.habitOrder.push(id); });
}

/* ============================== HABIT MUTATIONS ============================== */
function genId(prefix){ return (prefix||"h") + Date.now() + Math.floor(Math.random()*1000); }

function isFutureDate(ds){ return ds > todayStr(); }
function toggleComplete(id, ds){
  ds = ds || state.selectedDate;
  if (isFutureDate(ds)){ showFutureToast(); return; }
  const h = state.habits.find(x=>x.id===id);
  if (!h) return;
  const cur = h.completions[ds] || { done:false, progress:0 };
  if (h.goal?.enabled){
    const reached = cur.progress >= h.goal.target;
    h.completions[ds] = { progress: reached ? 0 : h.goal.target, done: !reached };
  } else {
    h.completions[ds] = { ...cur, done: !cur.done };
  }
  state.pulseId = id;
  save(); render();
  setTimeout(()=>{ state.pulseId=null; render(); }, 420);
  checkCelebration();
}
function adjustGoal(id, delta, ds){
  ds = ds || state.selectedDate;
  if (isFutureDate(ds)){ showFutureToast(); return; }
  const h = state.habits.find(x=>x.id===id);
  if (!h) return;
  const cur = h.completions[ds] || { done:false, progress:0 };
  const next = Math.max(0, Math.min(h.goal.target, cur.progress + delta));
  h.completions[ds] = { progress: next, done: next >= h.goal.target };
  save(); render();
  if (next >= h.goal.target) checkCelebration();
}
function showFutureToast(){
  state.toast = "No puedes marcar hábitos de días futuros todavía.";
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 2200);
}
function checkCelebration(){
  const ds = todayStr();
  if (state.selectedDate !== ds) return;
  const s = dayStats(state.habits, ds);
  if (s.active.length>0 && s.pct===100 && !state.celebratedDates.has(ds)){
    state.celebratedDates.add(ds);
    state.toast = "🎉 ¡Día completado! Todos tus hábitos hechos.";
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3200);
  }
}
function saveHabitForm(form){
  if (form.id){
    const h = state.habits.find(x=>x.id===form.id);
    Object.assign(h, form);
  } else {
    const newId = genId("h");
    state.habits.push({
      id: newId, name: form.name, emoji: form.emoji, color: form.color, category: form.category,
      frequency: form.frequency, time: form.time || null, goal: form.goal,
      reminder: false, createdAt: todayStr(), completions: {},
    });
    state.habitOrder.push(newId);
  }
  state.modal = null;
  save(); render();
}
function deleteHabit(id){
  state.habits = state.habits.filter(h=>h.id!==id);
  state.habitOrder = state.habitOrder.filter(x=>x!==id);
  state.modal = null;
  save(); render();
}
function toggleReminder(id){
  const h = state.habits.find(x=>x.id===id);
  if (h) h.reminder = !h.reminder;
  save(); render();
}
function resetAll(){
  state.habits = []; state.retos = [];
  save(); render();
}
function setTheme(t){ state.theme = t; save(); render(); }
function setView(v){ state.view = v; render(); }
function selectDate(ds){ state.selectedDate = ds; render(); }
function jumpToday(){ state.selectedDate = todayStr(); render(); }

/* ============================== RETOS (CHALLENGES) MUTATIONS ============================== */
function saveChallengeForm(form){
  if (form.id){
    const r = state.retos.find(x=>x.id===form.id);
    Object.assign(r, form);
  } else {
    state.retos.push({
      id: genId("r"), name: form.name, emoji: form.emoji, deadline: form.deadline,
      createdAt: todayStr(), done:false, doneAt:null,
    });
  }
  state.modal = null;
  save(); render();
}
function deleteChallenge(id){
  state.retos = state.retos.filter(r=>r.id!==id);
  state.modal = null;
  save(); render();
}
function toggleChallengeDone(id){
  const r = state.retos.find(x=>x.id===id);
  if (!r) return;
  r.done = !r.done;
  r.doneAt = r.done ? todayStr() : null;
  save(); render();
}

/* ============================== RENDER HELPERS ============================== */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function catOf(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1]; }
function ring(percent, size, stroke){
  size = size||92; stroke = stroke||9;
  const r=(size-stroke)/2, c=2*Math.PI*r, off = c - (Math.min(percent,100)/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--ring)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--accent)" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}
function pill(catId){
  const c = catOf(catId);
  return `<span class="pill" style="background:${c.color}22; color:${c.color}">${esc(c.label)}</span>`;
}
function emptyState(text){
  return `<div style="text-align:center; padding:40px 20px; color:var(--subtext); font-size:14px; line-height:1.5; border:1.5px dashed var(--border); border-radius:16px;">${esc(text)}</div>`;
}
function gearBtn(){
  return `<button class="gearbtn" onclick="openSettings()">⚙️</button>`;
}

/* ============================== DATE STRIP ============================== */
function renderDateStrip(){
  const center = todayStr();
  let pills = "";
  for (let i=-3;i<=21;i++){
    const ds = addDays(center, i);
    const s = dayStats(state.habits, ds);
    const hasData = s.active.length>0;
    const isSel = ds === state.selectedDate;
    const isToday = ds === center;
    const d = parseDateStr(ds);
    const isComplete = hasData && s.pct === 100;
    const isFuture = i > 0;
    let bg, border, color;
    if (isSel){
      bg = "var(--accent)"; border = "1.5px solid var(--accent)"; color = "#fff";
    } else if (isFuture){
      bg = "var(--card)"; border = "1.5px solid var(--border)"; color = "var(--text)";
    } else if (isComplete){
      bg = "#3FA37A"; border = "1.5px solid #3FA37A"; color = "#fff";
    } else if (hasData){
      bg = "var(--card)"; border = "1.5px solid #3FA37A"; color = isToday ? "var(--accent)" : "var(--text)";
    } else {
      bg = "var(--card)"; border = "1.5px solid var(--border)"; color = isToday ? "var(--accent)" : "var(--text)";
    }
    const noLine = i < 0 ? "no-line" : "";
    pills += `<div class="datepillwrap ${noLine}" onclick="selectDate('${ds}')">
      <span class="wd">${WD_MINI[d.getDay()]}</span>
      <div id="datepill-${ds}" class="datepill" style="border:${border}; background:${bg}; color:${color};">${d.getDate()}</div>
    </div>`;
  }
  return `<div class="datestrip" id="dateStripEl">${pills}</div>`;
}

/* ============================== VIEWS ============================== */
function relativeDateLabel(ds){
  const t = todayStr();
  if (ds === t) return "Hoy";
  if (ds === addDays(t,-1)) return "Ayer";
  if (ds === addDays(t,1)) return "Mañana";
  const d = parseDateStr(ds);
  return `${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
function timeBucket(h){
  if (!h.time) return "En cualquier hora del día";
  const hour = parseInt(h.time.split(":")[0], 10);
  if (hour < 12) return "Mañana";
  if (hour < 19) return "Tarde";
  return "Noche";
}
function groupByTimeOfDay(list){
  const order = ["Mañana","Tarde","Noche","En cualquier hora del día"];
  const buckets = {}; order.forEach(o=>buckets[o]=[]);
  list.forEach(h=>buckets[timeBucket(h)].push(h));
  return order.filter(o=>buckets[o].length>0).map(o=>({ label:o, items:buckets[o] }));
}
function lerp(a,b,t){ return a+(b-a)*Math.max(0,Math.min(1,t)); }
function sunYPosition(h){
  if (h>=5 && h<11) return lerp(150,88,(h-5)/6);
  if (h>=11 && h<16) return lerp(88,94,(h-11)/5);
  if (h>=16 && h<20) return lerp(94,150,(h-16)/4);
  return 55;
}
let heroCollapsed = false;
function heroIllustration(){
  const h = getEffectiveHour();
  const isNight = h>=20 || h<5;
  let sky1, sky2, sunColor, glow;
  if (h>=5 && h<11){ sky1="#1D2127"; sky2="#3A2E28"; sunColor="#F2B563"; glow="#F2B56333"; }
  else if (h>=11 && h<16){ sky1="#1F3A52"; sky2="#33556E"; sunColor="#FFE17A"; glow="#FFE17A2E"; }
  else if (h>=16 && h<20){ sky1="#201B29"; sky2="#402537"; sunColor="#E8916B"; glow="#E8916B2E"; }
  else { sky1="#0A0D18"; sky2="#12172C"; sunColor="#DCE1EF"; glow=""; }
  const sunY = sunYPosition(h);

  // Night: draw only a clean crescent moon, nothing else glowing around it.
  const bodyMarkup = isNight
    ? `<g>
         <mask id="moonMask">
           <rect x="0" y="0" width="400" height="170" fill="white"/>
           <circle cx="212" cy="${sunY-5}" r="27" fill="black"/>
         </mask>
         <circle cx="200" cy="${sunY}" r="26" fill="${sunColor}" mask="url(#moonMask)"/>
       </g>`
    : `<circle cx="200" cy="${sunY}" r="70" fill="${glow}"/>
       <circle cx="200" cy="${sunY}" r="46" fill="${glow}"/>
       <circle cx="200" cy="${sunY}" r="30" fill="${sunColor}"/>`;

  return `<div id="heroWrap" style="margin:0 -18px 8px; overflow:hidden; max-height:${heroCollapsed?'0px':'170px'}; transition:max-height .3s ease; touch-action:pan-y;"
      ontouchstart="heroTouchStart(event)" ontouchend="heroTouchEnd(event)">
    <svg viewBox="0 0 400 170" width="100%" height="170" preserveAspectRatio="xMidYMid slice" style="display:block;">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${sky1}" stop-opacity="0"/>
          <stop offset="24%" stop-color="${sky1}" stop-opacity="1"/>
          <stop offset="76%" stop-color="${sky2}" stop-opacity="1"/>
          <stop offset="100%" stop-color="${sky2}" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="hillFade1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
          <stop offset="55%" stop-color="#000000" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="hillFade2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
          <stop offset="60%" stop-color="#000000" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="400" height="170" fill="url(#skyGrad)"/>
      ${bodyMarkup}
      <path d="M0,120 C60,100 100,140 160,115 C220,90 260,130 320,105 C350,93 380,105 400,100 L400,170 L0,170 Z" fill="url(#hillFade1)"/>
      <path d="M0,145 C70,125 130,160 190,140 C250,120 300,155 400,130 L400,170 L0,170 Z" fill="url(#hillFade2)"/>
      <g fill="#3FA37A" opacity="0.9">
        <circle cx="55" cy="128" r="14"/>
        <rect x="53" y="138" width="4" height="14"/>
        <circle cx="330" cy="122" r="18"/>
        <rect x="327" y="136" width="5" height="16"/>
        <circle cx="255" cy="138" r="10"/>
        <rect x="253" y="146" width="3" height="10"/>
      </g>
    </svg>
  </div>
  <div onclick="toggleHero()" style="display:flex; justify-content:center; margin:-4px 0 6px; cursor:pointer;">
    <div style="width:34px; height:4px; border-radius:3px; background:var(--border);"></div>
  </div>`;
}
let heroTouchY = null;
let heroTouchX = null;
function heroTouchStart(e){ heroTouchY = e.touches[0].clientY; heroTouchX = e.touches[0].clientX; }
function heroTouchEnd(e){
  if (heroTouchY===null) return;
  const dy = e.changedTouches[0].clientY - heroTouchY;
  const dx = e.changedTouches[0].clientX - heroTouchX;
  heroTouchY = null; heroTouchX = null;
  // require a clear, mostly-vertical, deliberate swipe (not a light scroll wobble)
  if (Math.abs(dy) < 70 || Math.abs(dx) > Math.abs(dy)*0.6) return;
  if (dy < 0) { heroCollapsed = true; render(); }
  else { heroCollapsed = false; render(); }
}
function toggleHero(){ heroCollapsed = !heroCollapsed; render(); }
function renderPrincipal(){
  const ds = state.selectedDate;
  const stats = dayStats(state.habits, ds);
  const gs = generalStreak(state.habits);
  const isToday = ds === todayStr();
  const d = parseDateStr(ds);
  const dateLabel = `${WD_FULL[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;

  let cards = "";
  if (stats.active.length===0){
    cards = emptyState(isToday ? "No tienes actividades para hoy. Toca el botón + para crear tu primer hábito." : "No tenías actividades registradas este día.");
  } else {
    const groups = groupByTimeOfDay(orderedActive(stats.active));
    cards = groups.map(g => `
      <div style="font-size:12px; font-weight:400; color:var(--subtext); text-transform:uppercase; letter-spacing:1px; text-align:center; margin:14px 0 8px;">${g.label}</div>
      <div style="display:flex; flex-direction:column; gap:10px;">${g.items.map(h=>taskCard(h, ds)).join("")}</div>
    `).join("");
  }

  return `<div class="page">
    <div class="topbar">
      <div>
        <div style="font-size:19px; font-weight:700;">${relativeDateLabel(ds)}</div>
        <div style="font-size:12.5px; color:var(--subtext); margin-top:1px; text-transform:capitalize;">${dateLabel}${!isToday ? ` · <a onclick="jumpToday()" style="color:var(--accent); font-weight:600; cursor:pointer;">ir a hoy</a>` : ""}</div>
      </div>
      ${gearBtn()}
    </div>
    ${renderDateStrip()}
    ${heroIllustration()}
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
      ${gs>0 ? `<div style="display:flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:#E08A3F;">🔥 ${gs} ${gs===1?"día":"días"} seguidos</div>` : `<div></div>`}
      <div style="position:relative; width:60px; height:60px; flex-shrink:0;">
        ${ring(stats.pct, 60, 7)}
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;">${stats.pct}%</div>
      </div>
    </div>
    ${cards}
  </div>`;
}

function clockIconSVG(color, size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" stroke="${color}" stroke-width="2" fill="none"/>
    <circle cx="12" cy="12" r="1.1" fill="${color}"/>
    <path d="M12 6.5 L12 12" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M12 12 L16.2 14" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M12 3.3 L12 4.6 M12 19.4 L12 20.7 M3.3 12 L4.6 12 M19.4 12 L20.7 12" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;
}
function goalBadge(h, entry){
  if (!h.goal?.enabled){
    return `<div style="font-size:10.5px; color:var(--subtext); flex-shrink:0;">⟵ desliza</div>`;
  }
  const color = h.color || "#2E8B57";
  if (h.goal.mode === "timer"){
    return `<div style="display:flex; flex-direction:column; align-items:center; gap:3px; flex-shrink:0;">
      ${clockIconSVG(color, 26)}
      <div style="font-size:17px; font-weight:300; color:#fff; white-space:nowrap;">${h.goal.target} min</div>
    </div>`;
  }
  return `<div style="text-align:center; flex-shrink:0;">
    <div style="font-size:18px; font-weight:700; color:${color}; white-space:nowrap;">${entry.progress}/${h.goal.target}</div>
    <div style="font-size:11.5px; font-weight:600; color:${color}; margin-top:1px; white-space:nowrap;">${esc(h.goal.unit)}</div>
  </div>`;
}
function taskCard(h, ds){
  const entry = h.completions[ds] || { progress:0, done:false };
  const done = isDone(h, ds);
  const streak = habitStreak(h);
  const pulsing = state.pulseId === h.id;
  const cardBg = done ? "color-mix(in srgb, #3FA37A 16%, var(--card))" : "color-mix(in srgb, #ffffff 5%, var(--bg))";
  const cardBorder = done ? "1px solid #3FA37A55" : "1px solid var(--border)";

  const isFuture = isFutureDate(ds);
  const actions = [];
  if (!isFuture){
    if (h.goal?.enabled){
      const isTimer = h.goal.mode === "timer";
      if (isTimer){
        actions.push(`<button class="swipe-action" style="background:#E8B54A;" onclick="event.stopPropagation(); closeSwipe(this); openGoalModal('${h.id}')">⏱️</button>`);
      } else {
        actions.push(`<button class="swipe-action" style="background:${NAV_BLUE}; font-size:16px; font-weight:700; color:#fff;" onclick="event.stopPropagation(); closeSwipe(this); adjustGoal('${h.id}', 1, '${ds}')">+1</button>`);
      }
    }
    actions.push(`<button class="swipe-action" style="background:#3FA37A;" onclick="event.stopPropagation(); closeSwipe(this); toggleComplete('${h.id}','${ds}')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>`);
  }
  const revealW = actions.length * 62 + 10;

  return `<div class="task-wrap">
    <div class="task-actions">${actions.join("")}</div>
    <div class="card task-front ${pulsing?'flash-green':''}" data-reveal="${revealW}" onclick="cardTap(this,'${h.id}')" style="display:flex; align-items:center; gap:12px; padding:12px 13px; cursor:pointer; background:${cardBg}; border:${cardBorder}; border-bottom:3.5px solid color-mix(in srgb, var(--subtext) 35%, ${cardBg}); touch-action:pan-y; opacity:${isFuture?0.6:1};">
      <div class="habit-badge" style="width:38px; height:38px;">${iconImg(h.emoji, h.color||'#2E8B57', 34)}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:16px; font-weight:600; text-decoration:${done?"line-through":"none"}; color:${done?"var(--subtext)":"var(--text)"}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(h.name)}</div>
        <div style="display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap;">
          ${streak>0 ? `<span style="display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:${h.color||'#2E8B57'};">${iconImg('⭐', h.color||'#2E8B57', 16)}${streak} ${streak===1?"día":"días"} de racha!</span>` : ""}
        </div>
      </div>
      ${isFuture ? `<div style="font-size:10px; color:var(--subtext); flex-shrink:0;">🔒</div>` : (done ? `<div style="width:26px; height:26px; border-radius:50%; background:var(--accent); flex-shrink:0; display:flex; align-items:center; justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>` : goalBadge(h, entry))}
    </div>
  </div>`;
}

function renderProgress(){
  const ds = todayStr();
  const stats = dayStats(state.habits, ds);
  const gs = generalStreak(state.habits);
  const last7 = [];
  for (let i=6;i>=0;i--){ const d=addDays(ds,-i); last7.push({date:d, ...dayStats(state.habits,d)}); }
  const weekCount = last7.reduce((s,d)=>s+d.done.length,0);

  const bars = last7.map(d=>{
    const dow = parseDateStr(d.date).getDay();
    const label = WD_MINI[dow];
    const isToday = d.date===ds;
    const h = d.active.length ? d.pct : 0;
    return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="width:100%; height:64px; background:var(--ring); border-radius:6px; display:flex; align-items:flex-end; overflow:hidden;">
        <div style="width:100%; height:${h}%; background:var(--accent); border-radius:6px; transition:height .4s;"></div>
      </div>
      <span style="font-size:10.5px; color:${isToday?"var(--accent)":"var(--subtext)"}; font-weight:${isToday?700:500};">${label}</span>
    </div>`;
  }).join("");

  const streakList = state.habits.length===0
    ? emptyState("Crea hábitos para empezar a ver tus rachas y estadísticas.")
    : `<div style="display:flex; flex-direction:column; gap:8px;">` + state.habits.map(h=>{
        const s = habitStreak(h);
        return `<div class="card" style="display:flex; align-items:center; gap:10px; padding:10px 12px;">
          <span style="font-size:20px;">${h.emoji}</span>
          <span style="flex:1; font-size:13.5px; font-weight:500;">${esc(h.name)}</span>
          <span style="font-size:12.5px; font-weight:700; color:${s>0?"#E08A3F":"var(--subtext)"};">${s>0?"🔥 ":""}${s} ${s===1?"día":"días"}</span>
        </div>`;
      }).join("") + `</div>`;

  function statBox(label,value){
    return `<div class="card" style="padding:14px;"><div style="font-size:20px; font-weight:700;">${value}</div><div style="font-size:11.5px; color:var(--subtext); margin-top:2px;">${esc(label)}</div></div>`;
  }

  const last14 = [];
  for (let i=13;i>=0;i--){ const d=addDays(ds,-i); last14.push({date:d, ...dayStats(state.habits,d)}); }
  const chartW = 300, chartH = 90, padX = 6;
  const stepX = (chartW - padX*2) / (last14.length-1);
  const points = last14.map((d,i)=>{
    const pct = d.active.length ? d.pct : 0;
    const x = padX + i*stepX;
    const y = chartH - (pct/100)*chartH;
    return {x,y};
  });
  const polyPoints = points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaPath = `M${points[0].x},${chartH} L` + points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L") + ` L${points[points.length-1].x},${chartH} Z`;
  const trendChart = `<svg viewBox="0 0 ${chartW} ${chartH}" width="100%" height="${chartH}" preserveAspectRatio="none">
    <path d="${areaPath}" fill="var(--accent)" opacity="0.14"/>
    <polyline points="${polyPoints}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${points.map((p,i)=> last14[i].date===ds ? `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--accent)"/>` : "").join("")}
  </svg>`;

  return `<div class="page">
    <div class="topbar" style="margin-bottom:14px;">
      <div style="font-size:19px; font-weight:700;">Progreso</div>
      ${gearBtn()}
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
      ${statBox("Completadas hoy", stats.done.length)}
      ${statBox("Pendientes hoy", stats.pending)}
      ${statBox("Cumplimiento hoy", stats.pct+"%")}
      ${statBox("Racha general", "🔥 "+gs)}
    </div>
    <div class="card" style="padding:16px; margin-bottom:16px;">
      <div style="font-size:13.5px; font-weight:700; margin-bottom:4px;">Tendencia (14 días)</div>
      <div style="font-size:12px; color:var(--subtext); margin-bottom:10px;">% de cumplimiento diario</div>
      ${trendChart}
    </div>
    <div class="card" style="padding:16px; margin-bottom:16px;">
      <div style="font-size:13.5px; font-weight:700; margin-bottom:4px;">Últimos 7 días</div>
      <div style="font-size:12px; color:var(--subtext); margin-bottom:12px;">${weekCount} hábitos completados esta semana</div>
      <div style="display:flex; align-items:flex-end; gap:8px; height:90px;">${bars}</div>
    </div>
    <div style="font-size:13.5px; font-weight:700; margin-bottom:8px;">Rachas por hábito</div>
    ${streakList}
  </div>`;
}

/* ============================== TIMER + SOUND ============================== */
let timerState = { habitId:null, remaining:0, running:false, intervalId:null };
let audioCtx = null;
function ensureAudio(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
  return audioCtx;
}
function playNote(freq, startDelay, duration, type){
  try{
    const ctx = ensureAudio();
    if (!ctx) return;
    const startAt = ctx.currentTime + startDelay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, startAt);
    g.gain.exponentialRampToValueAtTime(0.4, startAt+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, startAt+duration);
    o.start(startAt); o.stop(startAt+duration+0.02);
  }catch(e){}
}
function beep(){ playNote(1000, 0, 0.5, "square"); }
function playAlarm(){
  // a short cheerful melody instead of a plain beep
  const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5]; // C5 E5 G5 C6 G5 C6
  let t = 0;
  notes.forEach((freq, i)=>{
    playNote(freq, t, 0.32, "triangle");
    t += 0.24;
  });
  try{ if (navigator.vibrate) navigator.vibrate([300,120,300,120,300]); }catch(e){}
}
function fmtTime(totalSec){ const m = Math.floor(totalSec/60), s = totalSec%60; return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"); }
let wakeLockRef = null;
async function requestWakeLock(){
  try{
    if ("wakeLock" in navigator){
      wakeLockRef = await navigator.wakeLock.request("screen");
    }
  }catch(e){ /* not supported or denied, silently ignore */ }
}
function releaseWakeLock(){
  try{ if (wakeLockRef) { wakeLockRef.release(); wakeLockRef = null; } }catch(e){}
}
function toggleTimer(id){
  ensureAudio();
  if (timerState.habitId !== id) return;
  if (timerState.running){
    clearInterval(timerState.intervalId);
    timerState.running = false; timerState.intervalId = null;
    releaseWakeLock();
    render();
  } else {
    requestWakeLock();
    timerState.running = true;
    timerState.intervalId = setInterval(()=>{
      timerState.remaining = Math.max(0, timerState.remaining - 1);
      const el = document.getElementById("timerDisplay");
      if (el) el.textContent = fmtTime(timerState.remaining);
      if (timerState.remaining <= 0){
        clearInterval(timerState.intervalId);
        timerState.running = false; timerState.intervalId = null;
        releaseWakeLock();
        onTimerComplete(id);
      }
    }, 1000);
    render();
  }
}
function resetTimer(id){
  const h = state.habits.find(x=>x.id===id);
  if (!h) return;
  if (timerState.intervalId) clearInterval(timerState.intervalId);
  releaseWakeLock();
  timerState = { habitId:id, remaining: h.goal.target*60, running:false, intervalId:null };
  render();
}
function onTimerComplete(id){
  playAlarm();
  const h = state.habits.find(x=>x.id===id);
  if (h){
    h.completions[state.selectedDate] = { progress: h.goal.target, done:true };
    save();
  }
  render();
  checkCelebration();
}

/* ============================== ONBOARDING (first run only) ============================== */
const ONBOARDING_QUESTIONS = [
  { key:"productivity", q:"¿Qué tan productivo te consideras?", opts:[
      {v:"bajo", l:"Bajo"}, {v:"medio", l:"Medio"}, {v:"alto", l:"Alto"} ] },
  { key:"bestTime", q:"¿Cuándo rendís mejor?", opts:[
      {v:"mañana", l:"🌅 Mañana"}, {v:"tarde", l:"☀️ Tarde"}, {v:"noche", l:"🌙 Noche"} ] },
  { key:"mainGoal", q:"¿Cuál es tu objetivo principal ahora?", opts:[
      {v:"salud", l:"🏃 Salud"}, {v:"estudio", l:"📖 Estudio"}, {v:"bienestar", l:"🧘 Bienestar"}, {v:"productividad", l:"🗒️ Productividad"} ] },
  { key:"habitCount", q:"¿Cuántos hábitos te gustaría seguir por día?", opts:[
      {v:"pocos", l:"1 a 3"}, {v:"varios", l:"4 a 6"}, {v:"muchos", l:"7 o más"} ] },
  { key:"reminderStyle", q:"¿Preferís recordatorios o hacerlo por tu cuenta?", opts:[
      {v:"recordatorios", l:"🔔 Recordatorios"}, {v:"solo", l:"🙋 Por mi cuenta"} ] },
];
let onboardingAnswers = {};
let onboardingStep = 0;
function setOnboardingAnswer(key, value){
  onboardingAnswers[key] = value;
  setTimeout(()=>{
    if (onboardingStep < ONBOARDING_QUESTIONS.length - 1){ onboardingStep++; render(); }
    else { finishOnboarding(); }
  }, 180);
  render();
}
function onboardingBack(){ if (onboardingStep>0){ onboardingStep--; render(); } }
function finishOnboarding(){
  state.profile = { ...onboardingAnswers };
  state.onboarded = true;
  save();
  render();
}
function renderOnboarding(){
  const step = ONBOARDING_QUESTIONS[onboardingStep];
  const dots = ONBOARDING_QUESTIONS.map((_,i)=>`<div style="width:${i===onboardingStep?18:6}px; height:6px; border-radius:3px; background:${i<=onboardingStep?'#3B82F6':'var(--border)'}; transition:width .2s;"></div>`).join("");
  const optsHtml = step.opts.map(o=>{
    const sel = onboardingAnswers[step.key] === o.v;
    return `<button onclick="setOnboardingAnswer('${step.key}','${o.v}')" style="width:100%; text-align:left; padding:15px 16px; border-radius:14px; font-size:14.5px; font-weight:600; cursor:pointer; margin-bottom:8px; ${sel?"border:2px solid #3B82F6; background:#3B82F622; color:#3B82F6;":"border:1px solid var(--border); background:var(--card); color:var(--text);"}">${o.l}</button>`;
  }).join("");
  document.getElementById("app").innerHTML = `<div class="page" style="padding-top:calc(30px + env(safe-area-inset-top)); min-height:100vh; display:flex; flex-direction:column;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:30px;">
      ${onboardingStep>0 ? `<button onclick="onboardingBack()" style="background:none; border:none; color:var(--subtext); font-size:20px; cursor:pointer; padding:4px;">‹</button>` : `<div style="width:20px;"></div>`}
      <div style="flex:1; display:flex; gap:5px; justify-content:center;">${dots}</div>
      <div style="width:20px;"></div>
    </div>
    <div style="text-align:center; margin-bottom:8px; font-size:36px;">${["⭐","🧭","🎯","📋","🔔"][onboardingStep] || "⭐"}</div>
    <div style="font-size:19px; font-weight:700; text-align:center; margin-bottom:26px; line-height:1.35; padding:0 6px;">${step.q}</div>
    <div>${optsHtml}</div>
  </div>`;
}

/* ============================== ROOT RENDER ============================== */
let lastCenterVisible = true;
function render(){
  if (!state.onboarded){ renderOnboarding(); return; }
  document.body.setAttribute("data-theme", state.theme);
  document.documentElement.setAttribute("data-theme", state.theme);

  // preserve modal scroll position across re-renders (avoid "jumping to top" on every tap)
  const prevModalSheet = document.querySelector(".modal-sheet");
  const prevModalScroll = prevModalSheet ? prevModalSheet.scrollTop : 0;
  // preserve overall page scroll position too (avoid the whole screen jumping when you complete a habit)
  const prevPageScroll = window.scrollY;

  const view = state.view === "principal" ? renderPrincipal()
    : state.view === "retos" ? renderRetos()
    : state.view === "plan" ? renderPlan()
    : renderProgress();

  const centerShouldShow = (state.view === "principal" || state.view === "retos");
  const justChanged = centerShouldShow !== lastCenterVisible;
  lastCenterVisible = centerShouldShow;
  const centerAnimClass = justChanged ? (centerShouldShow ? "nav-in" : "nav-out") : "";
  const centerStaticStyle = centerShouldShow ? "" : "opacity:0; transform:translate(-50%,-50%) scale(0.3); pointer-events:none;";
  const addAction = state.view === "retos" ? "openChallengeEditor(null)" : "openHabitEditor(null)";

  const waveShape = centerShouldShow
    ? `<path d="M0,35 Q0,16 24,16 L162,16 C176,16 178,27 184,32 C190,37 194,40 200,40 C206,40 210,37 216,32 C222,27 224,16 238,16 L376,16 Q400,16 400,35 L400,88 L0,88 Z" fill="#0B0D0E"/>`
    : `<path d="M0,24 Q0,16 8,16 L392,16 Q400,16 400,24 L400,88 L0,88 Z" fill="#0B0D0E"/>`;

  const nav = `<div class="navbar-wrap">
    <svg class="navwave" viewBox="0 0 400 88" preserveAspectRatio="none">${waveShape}</svg>
    <div class="navrow" style="justify-content:${centerShouldShow?'space-around':'center'}; gap:${centerShouldShow?'0':'20px'};">
      ${navBtn("principal","🏠","Principal")}
      ${navBtn("progress","📊","Estadísticas")}
      <div class="navspacer ${centerAnimClass==='nav-in'?'spacer-in':centerAnimClass==='nav-out'?'spacer-out':''}" style="width:${centerShouldShow?62:0}px;"></div>
      ${navBtn("retos","🏆","Retos")}
      ${navBtn("plan","🗒️","Planificar")}
    </div>
    <button class="navcenter ${centerAnimClass}" onclick="${addAction}" style="${centerStaticStyle}">
      <svg width="25" height="25" viewBox="0 0 24 24" style="display:block;"><path d="M12 4 L12 20 M4 12 L20 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
  </div>`;
  const toast = state.toast ? `<div class="toast">${esc(state.toast)}</div>` : "";

  document.getElementById("app").innerHTML = view + nav + toast + renderModal();

  const newModalSheet = document.querySelector(".modal-sheet");
  if (newModalSheet) newModalSheet.scrollTop = prevModalScroll;
  else window.scrollTo(0, prevPageScroll);

  if (state.view === "principal"){
    const sel = document.getElementById("datepill-" + state.selectedDate);
    if (sel) sel.scrollIntoView({ inline:"center", block:"nearest" });
  }
}
function navBtn(v, icon, label){
  const active = state.view===v;
  const color = active ? "#3B82F6" : "#8B9490";
  const iconHtml = v === "progress" ? statsIconSVG(color, 22) : iconImg(icon, color, 22);
  const box = active
    ? `<div style="width:34px; height:34px; border-radius:10px; border:1.8px solid #3B82F6; display:flex; align-items:center; justify-content:center;">${iconHtml}</div>`
    : `<div style="width:34px; height:34px; display:flex; align-items:center; justify-content:center;">${iconHtml}</div>`;
  return `<button class="navbtn ${active?'active':''}" onclick="setView('${v}')" style="color:${color};">${box}<span>${label}</span></button>`;
}

/* ============================== SWIPE-TO-COMPLETE ============================== */
let swipeCtx = null;
function getTranslateX(el){
  const t = window.getComputedStyle(el).transform;
  if (!t || t === "none") return 0;
  const m = t.match(/matrix\(([^)]+)\)/);
  if (!m) return 0;
  const parts = m[1].split(",").map(Number);
  return parts[4] || 0;
}
document.addEventListener("pointerdown", (e)=>{
  const front = e.target.closest(".task-front");
  if (!front) return;
  swipeCtx = { el:front, startX:e.clientX, startY:e.clientY, startTransform:getTranslateX(front), moved:false, locked:null, revealW:Number(front.dataset.reveal||68) };
});
document.addEventListener("pointermove", (e)=>{
  if (!swipeCtx) return;
  const dx = e.clientX - swipeCtx.startX;
  const dy = e.clientY - swipeCtx.startY;
  // decide gesture direction once, after a small deadzone, so vertical scrolling never gets hijacked
  if (swipeCtx.locked === null){
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    swipeCtx.locked = Math.abs(dx) > Math.abs(dy) * 1.3 ? "h" : "v";
  }
  if (swipeCtx.locked === "v") return; // let the page scroll normally
  swipeCtx.moved = true;
  let next = swipeCtx.startTransform + dx;
  next = Math.max(-swipeCtx.revealW, Math.min(0, next));
  swipeCtx.el.style.transition = "none";
  swipeCtx.el.style.transform = `translateX(${next}px)`;
});
function endSwipe(e){
  if (!swipeCtx) return;
  const ctx = swipeCtx; swipeCtx = null;
  if (ctx.locked !== "h"){ if (ctx.el) ctx.el.dataset.dragged = "0"; return; }
  const el = ctx.el;
  el.style.transition = "transform .18s ease";
  const dx = (e.clientX !== undefined ? e.clientX : ctx.startX) - ctx.startX;
  const finalX = Math.max(-ctx.revealW, Math.min(0, ctx.startTransform + dx));
  const open = finalX < -ctx.revealW/2;
  el.style.transform = `translateX(${open ? -ctx.revealW : 0}px)`;
  el.dataset.dragged = ctx.moved ? "1" : "0";
}
document.addEventListener("pointerup", endSwipe);
document.addEventListener("pointercancel", endSwipe);
function cardTap(el, id){
  if (el.dataset.dragged === "1"){ el.dataset.dragged = "0"; return; }
  openHabitEditor(id);
}
function closeSwipe(btn){
  const front = btn.closest(".task-wrap").querySelector(".task-front");
  if (front){ front.style.transition = "transform .18s ease"; front.style.transform = "translateX(0px)"; }
}

/* ============================== NOTIFICATIONS (foreground only) ============================== */
let notifiedKeys = new Set();
function checkHabitNotifications(){
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const now = new Date();
  const nowHM = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  const today = todayStr();
  state.habits.forEach(h=>{
    if (!h.reminder || !h.time || h.time !== nowHM) return;
    if (!isActive(h, today)) return;
    const key = h.id+"|"+today;
    if (notifiedKeys.has(key)) return;
    notifiedKeys.add(key);
    try{ new Notification("Hábitos", { body: `${h.emoji} Es hora de: ${h.name}` }); }catch(e){}
  });
}
setInterval(checkHabitNotifications, 20000);

/* ============================== INIT ============================== */
function showSplash(){
  document.getElementById("app").innerHTML = `<div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg);">
    <div style="width:56px; height:56px; border-radius:18px; background:var(--accent); display:flex; align-items:center; justify-content:center; animation:splashPulse 1s ease-in-out infinite;">
      <span style="font-size:26px;">⭐</span>
    </div>
    <div style="margin-top:14px; color:var(--subtext); font-size:13px;">Cargando tus hábitos…</div>
  </div>`;
}
document.body.setAttribute("data-theme","dark");
document.documentElement.setAttribute("data-theme","dark");
showSplash();
setTimeout(()=>{ load(); render(); }, 550);
</script>
